name: Pull Request CI

on:
  push:
    branches:
      - "main"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - auto_merge_enabled

env:
  NODE_VERSION: "22"

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [packages]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run build
        env:
          NODE_ENV: production
      - name: Check and commit dist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain dist) ]]; then
            git add dist
            git commit -m "chore: update dist"
            git pull --rebase origin ${{ github.head_ref || github.ref_name }}
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
  module_proxy_e2e:
    name: Module proxy end to end
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4.2.2
      # gocica's `serve` subcommand is not in a release yet, so build it from
      # source and hand it to the action through binary-path. That input exists
      # for exactly this.
      - uses: actions/checkout@v4.2.2
        with:
          repository: gocica-go/gocica
          ref: feat/goproxy
          path: gocica-src
      - uses: actions/setup-go@v6
        with:
          go-version-file: gocica-src/go.mod
          cache: false
      - name: Build gocica
        working-directory: gocica-src
        run: go build -o "$RUNNER_TEMP/gocica" .
      - name: Expose GitHub Actions runtime environment variables
        uses: crazy-max/ghaction-github-runtime@v4
      - uses: ./
        with:
          binary-path: ${{ runner.temp }}/gocica
          log-level: debug
      - name: GOPROXY must point at the daemon
        run: |
          echo "GOPROXY=$GOPROXY"
          case "$GOPROXY" in
            http://127.0.0.1:*\|*) ;;
            *) echo "the action did not prepend the module proxy to GOPROXY" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4.2.2
        with:
          repository: traPtitech/traQ
          ref: v3.22.0
          path: target
      - name: Build through the proxy
        working-directory: target
        run: |
          go mod download
          go build -o /dev/null ./...
        env:
          CGO_ENABLED: 0
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [packages]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs') }}
      - uses: reviewdog/action-eslint@v1
        with:
          level: error
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: "--ignore-pattern .gitignore --max-warnings=0 --cache --cache-location ./node_modules/.cache/eslint ./src"
  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [packages]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run type-check
  gocica_run:
    name: A job to run GoCICa action
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - name: GoCICa action
        uses: ./
      - name: Build standard library
        run: go install std
